name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, Test & Lint
        run: ./gradlew assembleDebug koverXmlReport detekt --build-cache --parallel

      - name: Add coverage report to PR
        if: github.event_name == 'pull_request'
        id: kover
        uses: mi-kas/kover-report@v1
        with:
          path: ${{ github.workspace }}/app/build/reports/kover/report.xml
          title: Code Coverage
          update-comment: true
          min-coverage-overall: 20
          min-coverage-changed-files: 20
          coverage-counter-type: LINE

      - name: Upload Test & Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-analysis-reports
          path: |
            **/build/reports/tests/
            **/build/reports/kover/
            **/build/reports/detekt/
          retention-days: 7
