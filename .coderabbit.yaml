# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  path_instructions:
    - path: "shared/**"
      instructions: |
        We are migrating to KMP with a 'shared-logic-first' approach using Koin.
        - **DI Integrity**: Ensure all new shared logic uses `org.koin.core.module.Module`.
        - Flag any accidental Hilt or Dagger imports in the `shared` module.
        - Verify that `factory` is used for stateless logic and `single` for long-lived state.

    - path: "shared/src/commonMain/**"
      instructions: |
        This is shared business logic.
        - **KMP Purity**: NO Android/Java dependencies allowed. Block any imports from `android.*`, `java.*`, or `androidx.compose.ui.platform.*` (which is Android-specific).
        - **DI & ViewModels**: Use Koin's `get()` for injection. Prefer `koin-viewmodel` in `commonMain` where possible to keep logic platform-agnostic.

    - path: "androidApp/src/main/res/layout/**"
      instructions: |
        Legacy XML layout.
        - If the change is small, suggest using a `ComposeView` instead.
        - If the changes are significant, suggest migrating this component fully to Jetpack Compose.

    - path: "**/di/**"
      instructions: |
        Check for proper Koin module definitions. Ensure `includes()` is used to link shared modules into platform modules.

  tools:
    github-checks:
      enabled: true

  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  # Don't automatically request changes on the PR (just leave comments)
  request_changes_workflow: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
